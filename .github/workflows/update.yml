name: Update F1 ratings & deploy Pages

on:
  schedule:
    # 09:00 UTC Mon = ~2 days after the Sunday race weekend, giving FIA time
    # to post penalties and the official classification to f1db.
    - cron: '0 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'data.js']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      # f1db -> ratings.json
      - run: python bio.py        # wikipedia -> bios.json
      - run: python prep.py       # ratings + bios -> data.js
      - id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data.js ratings.json index.html bios.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git add data.js ratings.json index.html bios.json
            git commit -m "chore: update ratings + bios from latest f1db release"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: update
    if: always() && (github.event_name == 'push' || needs.update.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site && cp index.html data.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
